<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Cockpit</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://sms-apps.com/deskcockpit/">
<script>
  // deskcockpit.app/<page> → sms-apps.com/deskcockpit/<page>/ (support, privacy…),
  // anything else → the Desk Cockpit page.
  (function () {
    var known = { "support": "support/", "privacy": "privacy/" };
    var page = location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();
    var target = "https://sms-apps.com/deskcockpit/" + (known[page] || "");
    location.replace(target + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="1; url=https://sms-apps.com/deskcockpit/">
</head>

</body>
